name: prod-ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-lab-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          pipx install yamllint
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Lint YAML
        run: yamllint .

  strict_validate:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Strict validation
        env:
          LAB_MODE: prod
        run: bash ./scripts/validate.sh

  boot_prod:
    runs-on: ubuntu-latest
    needs: strict_validate
    timeout-minutes: 15
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Boot prod stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

  full_smoke:
    runs-on: ubuntu-latest
    needs: boot_prod
    timeout-minutes: 15
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Boot prod stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
      - name: Wait for nginx healthy
        run: |
          for i in {1..20}; do
            status="$(docker inspect --format='{{json .State.Health.Status}}' nginx-reverse-proxy-lab-nginx-1 2>/dev/null || echo null)"
            if [ "$status" = '"healthy"' ]; then exit 0; fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs
          exit 1
      - name: Run full checks
        env:
          LAB_MODE: prod
        run: |
          bash ./scripts/smoke.sh
          bash ./scripts/headers-check.sh
          bash ./scripts/tls-check.sh
          bash ./scripts/rate-limit-check.sh
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans --volumes

  docs_verify:
    runs-on: ubuntu-latest
    needs: full_smoke
    timeout-minutes: 5
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Verify rollback and release docs
        run: |
          test -f docs/rollback.md
          test -f docs/change-approval.md
          test -f docs/prod-checklist.md
          grep -q 'rollback' docs/prod-checklist.md

  final_summary:
    runs-on: ubuntu-latest
    needs: docs_verify
    timeout-minutes: 5
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Create release summary
        run: |
          mkdir -p artifacts
          cat <<'EOF' > artifacts/prod-release-summary.md
          # Prod Release Summary

          - Workflow: prod-ci
          - Branch: prod
          - Checks: lint, strict validation, boot, smoke, docs verification
          - Approval gate: GitHub environment `prod`
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: prod-release-summary
          path: artifacts/prod-release-summary.md
          retention-days: 30
