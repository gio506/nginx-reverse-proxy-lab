name: prod-ci

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m pip install --user yamllint
      - name: Lint shell and YAML
        run: |
          shellcheck scripts/*.sh
          ~/.local/bin/yamllint .

  strict_validate:
    runs-on: ubuntu-latest
    needs: lint
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Strict validation
        env:
          LAB_MODE: prod
        run: bash ./scripts/validate.sh

  boot_prod:
    runs-on: ubuntu-latest
    needs: strict_validate
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Boot prod stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

  full_smoke:
    runs-on: ubuntu-latest
    needs: boot_prod
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Boot prod stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
      - name: Run full checks
        env:
          LAB_MODE: prod
        run: |
          bash ./scripts/smoke.sh
          bash ./scripts/headers-check.sh
          bash ./scripts/tls-check.sh
          bash ./scripts/rate-limit-check.sh

  docs_verify:
    runs-on: ubuntu-latest
    needs: full_smoke
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Verify rollback and release docs
        run: |
          test -f docs/rollback.md
          test -f docs/change-approval.md
          test -f docs/prod-checklist.md
          grep -q 'rollback' docs/prod-checklist.md

  final_summary:
    runs-on: ubuntu-latest
    needs: docs_verify
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Create release summary
        run: |
          mkdir -p artifacts
          cat <<'EOF' > artifacts/prod-release-summary.md
          # Prod Release Summary

          - Workflow: prod-ci
          - Branch: prod
          - Checks: lint, strict validation, boot, smoke, docs verification
          - Approval gate: GitHub environment `prod`
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: prod-release-summary
          path: artifacts/prod-release-summary.md
