name: main-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-lab-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          pipx install yamllint
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Lint YAML
        run: yamllint .

  validate:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    environment: main
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Validate
        env:
          LAB_MODE: main
        run: bash ./scripts/validate.sh

  smoke:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    environment: main
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Boot stack
        run: docker compose -f docker-compose.yml -f docker-compose.main.yml up --build -d
      - name: Wait for nginx healthy
        run: |
          for i in {1..20}; do
            status="$(docker inspect --format='{{json .State.Health.Status}}' nginx-reverse-proxy-lab-nginx-1 2>/dev/null || echo null)"
            if [ "$status" = '"healthy"' ]; then exit 0; fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.main.yml logs
          exit 1
      - name: Run extended tests
        env:
          LAB_MODE: main
        run: |
          bash ./scripts/smoke.sh
          bash ./scripts/headers-check.sh
          bash ./scripts/tls-check.sh
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.main.yml down --remove-orphans --volumes

  hardening:
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 5
    environment: main
    steps:
      - uses: actions/checkout@v4
      - name: Check hardening config
        run: |
          grep -q 'server_tokens off' nginx/nginx.conf
          grep -q 'X-Content-Type-Options' nginx/conf.d/headers.conf
          grep -q 'limit_req_zone' nginx/conf.d/rate-limit.conf
          grep -q 'ssl_session_cache' nginx/conf.d/tls.conf

  snapshot:
    runs-on: ubuntu-latest
    needs: hardening
    timeout-minutes: 5
    environment: main
    steps:
      - uses: actions/checkout@v4
      - name: Create config snapshot
        run: |
          mkdir -p artifacts
          tar -czf artifacts/main-config-snapshot.tgz nginx docker-compose.yml docker-compose.main.yml scripts docs
      - uses: actions/upload-artifact@v4
        with:
          name: main-config-snapshot
          path: artifacts/main-config-snapshot.tgz
          retention-days: 14
