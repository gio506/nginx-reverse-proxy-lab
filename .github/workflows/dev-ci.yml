name: dev-ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m pip install --user yamllint
      - name: Lint shell and YAML
        run: |
          shellcheck scripts/*.sh
          ~/.local/bin/yamllint .

  validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: ./scripts/generate-certs.sh
      - name: Validate compose and nginx
        env:
          LAB_MODE: dev
        run: ./scripts/validate.sh

  boot:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: ./scripts/generate-certs.sh
      - name: Boot stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
      - name: Show status
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml ps

  smoke:
    runs-on: ubuntu-latest
    needs: boot
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: ./scripts/generate-certs.sh
      - name: Boot stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
      - name: Run smoke checks
        env:
          LAB_MODE: dev
        run: |
          ./scripts/smoke.sh
          ./scripts/headers-check.sh

  cleanup:
    runs-on: ubuntu-latest
    needs: smoke
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: ./scripts/generate-certs.sh
      - name: Cleanup
        env:
          LAB_MODE: dev
        run: ./scripts/cleanup.sh
