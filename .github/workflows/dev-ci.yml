name: dev-ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-lab-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          pipx install yamllint
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Lint YAML
        run: yamllint .

  validate:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Validate compose and nginx config
        env:
          LAB_MODE: dev
        run: bash ./scripts/validate.sh

  smoke:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate local certs
        run: bash ./scripts/generate-certs.sh
      - name: Boot stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
      - name: Wait for nginx healthy
        run: |
          for i in {1..20}; do
            status="$(docker inspect --format='{{json .State.Health.Status}}' nginx-reverse-proxy-lab-nginx-1 2>/dev/null || echo null)"
            if [ "$status" = '"healthy"' ]; then exit 0; fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs
          exit 1
      - name: Run smoke and header checks
        env:
          LAB_MODE: dev
        run: |
          bash ./scripts/smoke.sh
          bash ./scripts/headers-check.sh
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down --remove-orphans --volumes
