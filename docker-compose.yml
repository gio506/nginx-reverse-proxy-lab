name: nginx-reverse-proxy-lab

services:
  app1:
    build:
      context: ./backends/app1
    environment:
      APP_NAME: app1
      APP_ENV: ${APP_ENV:-main}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lab

  app2:
    build:
      context: ./backends/app2
    environment:
      APP_NAME: app2
      APP_ENV: ${APP_ENV:-main}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lab

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lab

networks:
  lab:
    driver: bridge
